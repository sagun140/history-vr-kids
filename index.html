<title>Butterfly Atlas</title>
<meta name="description" content="Picture stories of world history for kids: press the arrow keys and watch one event lead to the next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;800&display=swap">
<style>
  /* One look on purpose: a dark classroom-projector room, so photos glow. */
  :root {
    --room: #0f1320; --wall: #171c2c; --card: rgb(15 19 32 / .86); --ink: #f4efe4; --muted: #aab1c4; --hair: #2a3147;
    --year: #ffb84d; --thread: #f06595; --land: #4a5a80; --sea: #121829;
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--room); color: var(--ink); }
  body { font-family: var(--body); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 18px; }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--year); outline-offset: 2px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; max-width: 1400px; margin: 0 auto 10px; }
  .brand { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; margin: 0; }
  .brand span { color: var(--thread); }
  .stories { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; padding-block: 4px; scrollbar-width: thin; }
  .chip { flex: none; border: 1.5px solid var(--hair); background: var(--wall); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--room); border-color: var(--ink); }
  .maplink { font-size: 13.5px; font-weight: 700; color: var(--muted); text-decoration: none; border-bottom: 1.5px dashed var(--hair); }
  .maplink:hover { color: var(--ink); }

  .stage { position: relative; max-width: 1400px; margin: 0 auto; height: min(74vh, 760px); min-height: 460px; border-radius: 20px; overflow: hidden; background: var(--wall); }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease, transform .5s ease; }
  .slide.on { opacity: 1; }
  .slide.from-right { transform: translateX(40px); } .slide.from-left { transform: translateX(-40px); }
  .slide.on.from-right, .slide.on.from-left { transform: none; }
  .backdrop { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.45) saturate(1.1); }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.on .photo { animation: drift 14s ease-out forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }
  .noimg { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(80px, 16vw, 220px); color: var(--hair); }

  .caption { position: absolute; left: 20px; bottom: 20px; width: min(520px, calc(100% - 40px)); background: var(--card); backdrop-filter: blur(6px); border-radius: 16px; padding: 16px 20px 14px; display: grid; gap: 4px; }
  .when { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); line-height: 1; color: var(--year); }
  .where { font-family: var(--mono); font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
  .caption h2 { margin: 2px 0 0; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.1; font-weight: 800; text-wrap: balance; }
  .caption p { margin: 4px 0 0; font-size: clamp(16px, 1.5vw, 19px); max-width: 48ch; }
  .so { margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed var(--hair); font-weight: 800; color: var(--thread); font-size: clamp(15px, 1.4vw, 18px); }
  .so small { display: block; font-family: var(--mono); font-weight: 500; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .credit { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: var(--muted); max-width: 46%; text-align: right; text-shadow: 0 1px 2px #000; }
  .credit a { color: inherit; }

  .mini { position: absolute; right: 16px; top: 16px; width: min(260px, 34%); border-radius: 12px; background: var(--card); padding: 6px; }
  .mini svg { display: block; width: 100%; height: auto; }
  .mini .sea { fill: var(--sea); } .mini .land { fill: var(--land); }
  .mini .trail { fill: none; stroke: var(--thread); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 2 12; }
  .mini .here { fill: var(--year); stroke: var(--room); stroke-width: 4; }
  .mini .was { fill: var(--thread); }
  .mini .pulse { fill: none; stroke: var(--year); stroke-width: 4; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }

  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); font-size: 30px; line-height: 1; display: grid; place-items: center; z-index: 2; }
  .arrow:hover:not(:disabled) { background: var(--ink); color: var(--room); }
  .arrow:disabled { opacity: .25; cursor: default; }
  .prev { left: 14px; } .next { right: 14px; }
  .count { position: absolute; left: 20px; top: 16px; font-family: var(--mono); font-size: 13px; background: var(--card); padding: 4px 10px; border-radius: 999px; z-index: 2; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); }

  .strip { max-width: 1400px; margin: 10px auto 0; display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; padding-block: 4px 6px; scrollbar-width: thin; }
  .thumb { flex: none; width: 118px; border: 0; background: none; padding: 0; text-align: left; opacity: .55; }
  .thumb[aria-current="true"], .thumb:hover { opacity: 1; }
  .thumb .tb { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: var(--wall) center / cover; border: 2.5px solid transparent; }
  .thumb[aria-current="true"] .tb { border-color: var(--year); }
  .thumb b { display: block; font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--year); margin-top: 3px; }
  .thumb span { display: block; font-size: 12px; font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  @media (max-width: 720px) {
    .stage { height: auto; min-height: 0; aspect-ratio: auto; display: block; }
    .slide { position: relative; display: none; }
    .slide.on { display: block; }
    .picture { position: relative; height: 56vw; min-height: 220px; overflow: hidden; }
    .caption { position: static; width: auto; border-radius: 0; background: var(--wall); }
    .mini { width: 38%; top: 10px; right: 10px; }
    .arrow { top: 28vw; width: 48px; height: 48px; font-size: 24px; }
    .credit { position: static; max-width: none; text-align: left; padding: 0 20px 12px; background: var(--wall); text-shadow: none; }
    .count { top: 10px; left: 10px; }
  }
  @media (min-width: 721px) { .picture { position: absolute; inset: 0; overflow: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .slide { transition: none; } .slide.on .photo, .mini .pulse { animation: none; }
  }
</style>

<header class="bar">
  <h1 class="brand">Butterfly<span>·</span>Atlas</h1>
  <nav class="stories" id="stories" aria-label="Choose a story"></nav>
  <a class="maplink" href="atlas.html">Compare two eras on the map →</a>
</header>

<main>
  <section class="stage" id="stage" aria-roledescription="slideshow" aria-live="polite">
    <span class="count" id="count"></span>
    <button class="arrow prev" id="prev" aria-label="Previous picture">←</button>
    <button class="arrow next" id="next" aria-label="Next picture">→</button>
  </section>
  <nav class="strip" id="strip" aria-label="All pictures in this story"></nav>
</main>

<script src="land.js"></script>
<script src="data.js"></script>
<script src="stories.js"></script>
<script src="images.js"></script>
<script src="slides.js"></script>
