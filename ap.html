<style>
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; max-width: 1200px; margin: 0 auto 12px; }
  .brand { font-family: var(--display); font-size: clamp(26px, 3.6vw, 36px); line-height: 1; margin: 0; letter-spacing: .5px; }
  .brand span { color: var(--thread); }
  .lede { margin: 0; color: var(--muted); max-width: 56ch; }
  .top .sitenav { margin-left: auto; }

  .wrap { max-width: 1200px; margin: 0 auto; }
  .card { background: var(--panel); border-radius: 18px; padding: 18px; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
  h2.big { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); line-height: 1.1; margin: 2px 0 8px; text-wrap: balance; }
  .note { color: var(--muted); font-size: 13px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---- home ---- */
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
  .tile { background: var(--panel); border: 2px solid var(--hair); border-radius: 16px; padding: 16px; text-align: left; display: grid; gap: 4px; align-content: start; }
  .tile:hover { border-color: var(--thread); }
  .tile b { font-size: 17px; }
  .tile .mono { font-size: 12px; color: var(--muted); }
  .units { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .resume { border-color: var(--thread); }

  /* ---- exam chrome ---- */
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); border-radius: 14px; padding: 8px 14px; margin-bottom: 12px; position: sticky; top: 8px; z-index: 5; }
  .bar .sec { font-weight: 800; }
  .clock { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; margin-left: auto; }
  .clock.low { color: var(--bad); }
  .clock.off { color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .src { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .stim { white-space: pre-wrap; }
  .stim.quote { border-left: 3px solid var(--hair); padding-left: 12px; font-size: 15.5px; }
  table.stim { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.stim th, table.stim td { border-bottom: 1px solid var(--hair); text-align: left; padding: 5px 8px; vertical-align: top; }
  table.stim th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .qtext { font-weight: 700; font-size: 16.5px; margin: 0 0 10px; }
  .choices { display: grid; gap: 7px; }
  .choice { display: grid; grid-template-columns: 26px 1fr; gap: 9px; align-items: start; text-align: left; border: 1.5px solid var(--hair); background: transparent; border-radius: 12px; padding: 9px 11px; font-size: 14.5px; }
  .choice:hover { border-color: var(--ink); }
  .choice .ltr { font-family: var(--mono); font-weight: 500; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--hair); display: grid; place-items: center; font-size: 12px; }
  .choice[aria-pressed="true"] { border-color: var(--thread); }
  .choice[aria-pressed="true"] .ltr { background: var(--thread); border-color: var(--thread); color: #fff; }
  .choice.right { border-color: var(--good); }
  .choice.right .ltr { background: var(--good); border-color: var(--good); color: #fff; }
  .choice.wrong { border-color: var(--bad); }
  .choice.wrong .ltr { background: var(--bad); border-color: var(--bad); color: #fff; }
  .choice .why { grid-column: 2; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .skill { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
  .nav .spacer { flex: 1; }
  .pad { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .pad button { width: 30px; height: 28px; border-radius: 8px; border: 1.5px solid var(--hair); background: transparent; font-family: var(--mono); font-size: 11px; }
  .pad button.done { background: color-mix(in srgb, var(--now) 22%, transparent); border-color: var(--now); }
  .pad button.flag { border-color: var(--then); border-width: 2.5px; }
  .pad button[aria-current="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

  /* ---- writing sections ---- */
  textarea { width: 100%; min-height: 180px; font: inherit; font-size: 15px; line-height: 1.5; color: inherit; background: color-mix(in srgb, var(--ground) 50%, var(--panel)); border: 1.5px solid var(--hair); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  textarea:focus { border-color: var(--thread); }
  .count { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .part { margin-top: 12px; }
  .part b { display: block; }
  .docs { display: grid; gap: 12px; max-height: 70vh; overflow: auto; padding-right: 4px; }
  .doc { border: 1.5px solid var(--hair); border-radius: 12px; padding: 10px 12px; }
  .doc .n { font-family: var(--display); color: var(--thread); font-size: 18px; }
  .rubric { display: grid; gap: 10px; }
  .row { border-bottom: 1px solid var(--hair); padding-bottom: 9px; }
  .row .ask { font-size: 13.5px; color: var(--muted); }
  .row .check { font-size: 13px; margin: 5px 0 0 0; padding-left: 18px; }
  .pick { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .guide { background: color-mix(in srgb, var(--good) 10%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .guide ul { margin: 4px 0 0; padding-left: 18px; }

  /* ---- report ---- */
  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .score { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  .score .v { font-family: var(--display); font-size: 28px; line-height: 1.1; color: var(--thread); }
  .predict { font-family: var(--display); font-size: clamp(54px, 12vw, 86px); line-height: 1; color: var(--thread); }
  .bars { display: grid; gap: 6px; margin-top: 6px; }
  .barrow { display: grid; grid-template-columns: 1fr 120px 52px; gap: 8px; align-items: center; font-size: 13.5px; }
  .meter { height: 9px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--thread); }
  .miss { border-top: 1px solid var(--hair); padding: 10px 0; }
  .miss .q { font-weight: 700; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  a.atlas { color: var(--thread); font-weight: 700; font-size: 13px; text-decoration: none; border-bottom: 1.5px solid currentColor; }

  .sheet { display: none; }
  @media print {
    body { background: #fff; font-size: 11.5pt; padding: 0; }
    .top, .bar, .nav, .pad, .menu, .noprint { display: none !important; }
    .card, .score { background: #fff; border-radius: 0; padding: 0; }
    .sheet { display: block; }
    .doc, .row { break-inside: avoid; }
    h2.big { font-size: 18pt; }
  }
</style>
